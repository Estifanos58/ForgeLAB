services:
  postgres:
    image: postgres:16-alpine
    container_name: forgelab-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgelab_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-forgelab}
    volumes:
      - forgelab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgelab} -d ${POSTGRES_DB:-forgelab}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s

  redis:
    image: redis:7-alpine
    container_name: forgelab-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - forgelab_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: forgelab-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgelab-migrate
    restart: "no"
    command: ["./forgelab-migrate", "up"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-forgelab}:${POSTGRES_PASSWORD:-forgelab_dev_password}@postgres:5432/${POSTGRES_DB:-forgelab}?sslmode=disable
    volumes:
      - ./backend/migrations:/app/migrations:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: forgelab-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgelab-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BACKEND_PORT_BINDING:-127.0.0.1:8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-forgelab}:${POSTGRES_PASSWORD:-forgelab_dev_password}@postgres:5432/${POSTGRES_DB:-forgelab}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-forgelab-dev-jwt-secret-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-48h}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-14d}
      FORGELAB_ENCRYPTION_KEY: ${FORGELAB_ENCRYPTION_KEY:-dGhpcy1pcy1hLWRldi1rZXktY2hhbmdlLWluLXByb2Q=}
      FORGELAB_WORK_DIR: /app/data/builds
      FORGELAB_SOURCES_DIR: /app/data/sources
      FORGELAB_ALLOWED_SOURCE_ROOTS: ${FORGELAB_ALLOWED_SOURCE_ROOTS:-}
      # Host source root directory for bind mounts; if left empty, ForgeLAB auto-derives the Docker-daemon-visible root from the container mount below
      FORGELAB_HOST_SOURCE_ROOT: ${FORGELAB_HOST_SOURCE_ROOT:-}
      FORGELAB_CONTAINER_SOURCE_ROOT: /host-projects
      FORGELAB_LOCAL_BUILD_MODE: ${FORGELAB_LOCAL_BUILD_MODE:-direct}
      FORGELAB_MAX_CONCURRENT_BUILDS: ${FORGELAB_MAX_CONCURRENT_BUILDS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:3000/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-http://localhost:3000/api/auth/github/callback}
      GITHUB_REPO_REDIRECT_URL: ${GITHUB_REPO_REDIRECT_URL:-http://localhost:3000/api/integrations/github/callback}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      FORGELAB_IN_DOCKER: "true"
      FORGELAB_AGENT_URL: ${FORGELAB_AGENT_URL:-http://host.docker.internal:4142}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-127.0.0.1,::1}
      FORGELAB_ALLOW_GUEST_MODE: ${FORGELAB_ALLOW_GUEST_MODE:-false}
      FORGELAB_SHARING_ENABLED: ${FORGELAB_SHARING_ENABLED:-true}
      FORGELAB_SHARING_PROVIDER: ${FORGELAB_SHARING_PROVIDER:-cloudflare}
      FORGELAB_CLOUDFLARED_PATH: ${FORGELAB_CLOUDFLARED_PATH:-cloudflared}
      GATEWAY_TUNNEL_URL: ${GATEWAY_TUNNEL_URL:-}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-}
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN:-}
      GATEWAY_TLS_SKIP_VERIFY: ${GATEWAY_TLS_SKIP_VERIFY:-false}
      FORGELAB_APP_HOST_IP: ${FORGELAB_APP_HOST_IP:-127.0.0.1}
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://caddy:2019}
      FORGELAB_INGRESS_HOST: ${FORGELAB_INGRESS_HOST:-localhost}
      FORGELAB_CADDY_TARGET_HOST: ${FORGELAB_CADDY_TARGET_HOST:-host.docker.internal}
      ACME_EMAIL: ${ACME_EMAIL:-}
      FORGELAB_RUNTIME_HEALTH_CHECK_INTERVAL: ${FORGELAB_RUNTIME_HEALTH_CHECK_INTERVAL:-30s}
      FORGELAB_AUTO_ROLLBACK_ENABLED: ${FORGELAB_AUTO_ROLLBACK_ENABLED:-true}
      FORGELAB_AUTO_ROLLBACK_THRESHOLD: ${FORGELAB_AUTO_ROLLBACK_THRESHOLD:-3}
      FORGELAB_AUTO_ROLLBACK_COOLDOWN: ${FORGELAB_AUTO_ROLLBACK_COOLDOWN:-5m}
      FORGELAB_SELF_HEAL_ENABLED: ${FORGELAB_SELF_HEAL_ENABLED:-true}
      FORGELAB_SELF_HEAL_MAX_RESTARTS: ${FORGELAB_SELF_HEAL_MAX_RESTARTS:-3}
      FORGELAB_CRASH_LOOP_THRESHOLD: ${FORGELAB_CRASH_LOOP_THRESHOLD:-3}
      FORGELAB_CRASH_LOOP_WINDOW: ${FORGELAB_CRASH_LOOP_WINDOW:-10m}
      FORGELAB_METRICS_CACHE_TTL: ${FORGELAB_METRICS_CACHE_TTL:-10s}
      FORGELAB_METRICS_SAMPLE_INTERVAL: ${FORGELAB_METRICS_SAMPLE_INTERVAL:-15s}
      FORGELAB_METRICS_RETENTION_DAYS: ${FORGELAB_METRICS_RETENTION_DAYS:-7}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - forgelab_builds:/app/data/builds
      - forgelab_sources:/app/data/sources
      - ${FORGELAB_HOST_SOURCE_ROOT:-./}:/host-projects:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forgelab-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT_BINDING:-127.0.0.1:3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-127.0.0.1,::1}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: forgelab-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT_BINDING:-80}:80"
      - "${CADDY_HTTPS_PORT_BINDING:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      FORGELAB_INGRESS_HOST: ${FORGELAB_INGRESS_HOST:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - forgelab_caddy_data:/data
      - forgelab_caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  forgelab_pgdata:
  forgelab_redisdata:
  forgelab_builds:
  forgelab_sources:
  forgelab_caddy_data:
  forgelab_caddy_config:
